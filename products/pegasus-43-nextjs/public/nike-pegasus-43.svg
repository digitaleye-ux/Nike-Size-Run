<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Shadow Gradient -->
    <radialGradient id="shoeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Upper Body Mesh Gradient -->
    <linearGradient id="upperMesh" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2c2c2e" />
      <stop offset="45%" stop-color="#1c1c1e" />
      <stop offset="85%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>

    <!-- Volt Accent Gradient -->
    <linearGradient id="voltGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8e600" />
      <stop offset="50%" stop-color="#d4ff00" />
      <stop offset="100%" stop-color="#eaff4d" />
    </linearGradient>

    <!-- React Foam Midsole Gradient -->
    <linearGradient id="midsoleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f5f5f7" />
      <stop offset="100%" stop-color="#e1e1e6" />
    </linearGradient>

    <!-- Heel Overlay Gradient -->
    <linearGradient id="heelOverlay" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3c" />
      <stop offset="100%" stop-color="#18181a" />
    </linearGradient>

    <!-- Mesh Pattern -->
    <pattern id="meshDots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#3a3a3e" opacity="0.6" />
      <circle cx="6" cy="6" r="0.9" fill="#3a3a3e" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Shadow on floor -->
  <ellipse cx="250" cy="385" rx="195" ry="24" fill="url(#shoeShadow)" />

  <!-- Shoe Group rotated slightly for dynamic stance -->
  <g transform="translate(15, 10)">
    <!-- Outsole (Bottom Waffle Tread) -->
    <path d="M 75 355 C 105 358, 150 360, 200 358 C 260 355, 330 366, 385 365 C 415 364, 435 348, 442 338 C 440 348, 415 372, 380 372 C 320 372, 255 362, 195 365 C 145 367, 100 365, 70 361 C 60 359, 58 354, 75 355 Z" fill="#1c1c1e" />
    
    <!-- Outsole Volt Pods (Front Traction) -->
    <path d="M 345 364 C 365 365, 395 363, 420 352 L 415 356 C 390 366, 365 368, 345 366 Z" fill="url(#voltGlow)" />
    <path d="M 285 360 C 305 361, 325 362, 340 363 L 338 365 C 322 364, 302 363, 285 362 Z" fill="url(#voltGlow)" />

    <!-- React Foam Midsole -->
    <path d="M 68 340 
             C 65 315, 82 295, 105 292 
             C 140 288, 185 315, 235 320 
             C 285 325, 345 310, 400 318 
             C 425 322, 445 330, 442 342 
             C 440 352, 420 364, 385 365 
             C 330 366, 260 355, 200 358 
             C 150 360, 105 358, 75 355 
             C 68 352, 67 344, 68 340 Z" 
          fill="url(#midsoleGrad)" stroke="#dcdce0" stroke-width="0.8" />

    <!-- Midsole Sculpting Grooves (Nike React Cushioning Lines) -->
    <path d="M 95 325 Q 145 328, 195 335 Q 260 342, 340 338 Q 395 334, 430 332" fill="none" stroke="#d1d1d6" stroke-width="2" stroke-linecap="round" />
    <path d="M 120 342 Q 175 345, 235 346 Q 300 347, 375 348" fill="none" stroke="#e5e5ea" stroke-width="1.5" />
    
    <!-- React Foam Logo Badge on Midsole -->
    <text x="145" y="347" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#8e8e93" letter-spacing="1.5">NIKE REACT</text>

    <!-- Volt Midsole Accent Line (Electric Volt Highlight) -->
    <path d="M 235 320 C 285 325, 345 310, 400 318 C 418 321, 432 326, 438 333 C 435 335, 418 327, 398 324 C 345 316, 285 330, 235 325 Z" fill="url(#voltGlow)" />

    <!-- Shoe Upper Mesh Base -->
    <path d="M 105 292 
             C 100 270, 105 240, 120 205 
             C 125 195, 140 190, 155 210 
             C 170 230, 195 242, 230 248 
             C 275 255, 340 275, 395 298 
             C 425 310, 442 322, 440 332 
             C 425 322, 400 318, 385 316 
             C 330 310, 275 320, 235 320 
             C 185 315, 140 288, 105 292 Z" 
          fill="url(#upperMesh)" />

    <!-- Upper Mesh Texture Overlay -->
    <path d="M 220 250 C 270 258, 335 278, 390 300 C 420 312, 435 322, 432 330 C 400 318, 340 312, 280 320 C 235 320, 195 315, 175 305 Z" fill="url(#meshDots)" />

    <!-- Heel Counter Overlay & Support Cage -->
    <path d="M 80 335 C 75 305, 88 260, 115 220 C 120 212, 130 220, 135 235 C 142 260, 138 290, 105 292 C 85 295, 80 315, 80 335 Z" fill="url(#heelOverlay)" />
    
    <!-- Heel Collar / Inner Sock Liner (Volt Interior) -->
    <path d="M 120 205 C 130 190, 150 188, 165 215 C 155 218, 140 215, 130 210 Z" fill="url(#voltGlow)" opacity="0.9" />

    <!-- Volt Heel Tab -->
    <path d="M 108 222 C 102 210, 105 198, 112 195 C 115 195, 118 200, 118 210 Z" fill="url(#voltGlow)" />

    <!-- Eyestay Reinforcement Strip -->
    <path d="M 160 212 C 185 228, 220 242, 265 252 L 260 258 C 218 248, 180 234, 155 218 Z" fill="#2c2c2e" />

    <!-- Laces (Volt & Black Flecked Lacing) -->
    <path d="M 168 215 Q 185 222, 202 232" stroke="url(#voltGlow)" stroke-width="3" stroke-linecap="round" />
    <path d="M 188 224 Q 208 232, 228 242" stroke="url(#voltGlow)" stroke-width="3" stroke-linecap="round" />
    <path d="M 212 235 Q 232 243, 252 251" stroke="url(#voltGlow)" stroke-width="3" stroke-linecap="round" />
    <path d="M 238 246 Q 256 253, 274 260" stroke="url(#voltGlow)" stroke-width="3" stroke-linecap="round" />

    <!-- Toe Cap / Forefoot Protective Film Overlay -->
    <path d="M 400 315 C 420 322, 442 332, 440 338 C 430 338, 410 330, 395 324 Z" fill="#2c2c2e" opacity="0.7" />

    <!-- Iconic Nike Swoosh (Large, Bold White with Volt Backlight Glow) -->
    <!-- Volt Backlight Glow -->
    <path d="M 152 268 
             C 192 278, 245 288, 305 285 
             C 335 282, 375 272, 402 258 
             C 405 256, 408 260, 404 264 
             C 368 295, 305 315, 242 312 
             C 198 310, 165 292, 148 274 
             C 145 270, 148 266, 152 268 Z" 
          fill="none" stroke="url(#voltGlow)" stroke-width="5" opacity="0.6" stroke-linejoin="round" />

    <!-- Crisp White Swoosh -->
    <path d="M 155 270 
             C 195 280, 248 290, 305 286 
             C 335 284, 372 274, 400 260 
             C 402 259, 403 262, 400 265 
             C 365 294, 305 313, 245 310 
             C 202 308, 170 292, 152 275 
             C 150 272, 152 269, 155 270 Z" 
          fill="#ffffff" />

    <!-- Pegasus 43 Subtle Typography on Midfoot / Heel -->
    <text x="125" y="278" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="700" fill="#ffffff" opacity="0.4" letter-spacing="1">PEGASUS 43</text>
  </g>
</svg>
