<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowF" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="voltF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8e600" />
      <stop offset="50%" stop-color="#d4ff00" />
      <stop offset="100%" stop-color="#eaff4d" />
    </linearGradient>
  </defs>
  <ellipse cx="250" cy="410" rx="140" ry="25" fill="url(#shadowF)" />
  <g transform="translate(140, 60)">
    <!-- Shoe Toe-Down Perspective -->
    <path d="M 60 40 C 90 20, 130 20, 160 40 C 190 70, 200 150, 195 240 C 190 310, 175 350, 150 360 C 125 370, 95 370, 70 360 C 45 350, 30 310, 25 240 C 20 150, 30 70, 60 40 Z" fill="#1c1c1e" />
    <path d="M 50 180 C 80 160, 140 160, 170 180 L 180 250 C 140 265, 80 265, 40 250 Z" fill="#2c2c2e" />
    <!-- Volt Laces & Tongue -->
    <path d="M 80 170 Q 110 185, 140 170" stroke="url(#voltF)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 75 200 Q 110 215, 145 200" stroke="url(#voltF)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 70 230 Q 110 245, 150 230" stroke="url(#voltF)" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- White Swooshes on flanks -->
    <path d="M 32 170 Q 20 220, 35 270 Q 24 235, 32 170" fill="#ffffff" />
    <path d="M 188 170 Q 200 220, 185 270 Q 196 235, 188 170" fill="#ffffff" />
    <!-- React Sole Rim -->
    <path d="M 25 300 C 20 340, 45 365, 110 368 C 175 365, 200 340, 195 300 C 198 320, 185 360, 110 364 C 35 360, 22 320, 25 300 Z" fill="#ffffff" stroke="#dcdce0" />
    <text x="75" y="110" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="url(#voltF)" letter-spacing="2">AIR ZOOM</text>
  </g>
