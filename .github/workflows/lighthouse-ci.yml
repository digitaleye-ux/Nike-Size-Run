name: Mobile Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse-check:
    name: Mobile Slow 4G Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: products/pegasus-43-nextjs/package-lock.json

      - name: Verify 8 Dec Snapshot Parity
        run: node scripts/verify-sizes-snapshot.mjs

      - name: Install dependencies
        run: cd products/pegasus-43-nextjs && npm ci

      - name: Build Next.js
        run: cd products/pegasus-43-nextjs && npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
